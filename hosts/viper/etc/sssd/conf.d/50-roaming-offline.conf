# Roaming laptop: login must never wait long on IPA. Worst case is ~10s,
# then SSSD goes offline and authenticates against the cached password.
[domain/quad5.net]
# One server: _srv_ and ipa.quad5.net resolved to the same host, doubling every wait.
ipa_server = ipa.quad5.net
dns_resolver_timeout = 4
dns_resolver_op_timeout = 2
ldap_network_timeout = 3
ldap_opt_timeout = 5
krb5_auth_timeout = 5
# Retry the server every 30s in the background once offline (default 60).
offline_timeout = 30
# For 12h after a successful online login, check passwords against the cache
# without touching the network. 12h < the 24h TGT lifetime, so NFS Kerberos
# tickets still get refreshed by a later online login before they expire.
cached_auth_timeout = 43200
