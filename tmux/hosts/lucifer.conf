# Keep uptime alongside the shared clock and date on Lucifer.
set-option -g status-right "#[fg=red,dim,bg=default]#(~/code/dotfiles/bin/tmux-uptime) #[default]"
set-option -ag status-right "#[fg=white,bg=default]%a%l:%M:%S %p#[default] #[fg=blue]%Y-%m-%d"

# Use fine scrolling for clients attached over SSH (normally Viper), while
# retaining Lucifer's faster local scrolling. #{client_pid} identifies the
# tmux client handling this particular mouse event, so simultaneous local and
# remote attachments do not interfere with each other.
bind-key -T copy-mode WheelUpPane if-shell 'grep -zq "^SSH_CONNECTION=" /proc/#{client_pid}/environ' 'send-keys -X -N 1 scroll-up' 'send-keys -X -N 3 scroll-up'
bind-key -T copy-mode WheelDownPane if-shell 'grep -zq "^SSH_CONNECTION=" /proc/#{client_pid}/environ' 'send-keys -X -N 1 scroll-down' 'send-keys -X -N 3 scroll-down'
bind-key -T copy-mode-vi WheelUpPane if-shell 'grep -zq "^SSH_CONNECTION=" /proc/#{client_pid}/environ' 'send-keys -X -N 1 scroll-up' 'send-keys -X -N 3 scroll-up'
bind-key -T copy-mode-vi WheelDownPane if-shell 'grep -zq "^SSH_CONNECTION=" /proc/#{client_pid}/environ' 'send-keys -X -N 1 scroll-down' 'send-keys -X -N 3 scroll-down'
