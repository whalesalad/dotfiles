# ─────────────────────────────────────────────
# Hyprland config — jackal (MacBookPro15,1)
# ─────────────────────────────────────────────

monitor=,preferred,auto,2

# ── Autostart ────────────────────────────────
# Propagate Wayland env to systemd user services (required for toshy, etc.)
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP XDG_SESSION_TYPE
exec-once = waybar
exec-once = hyprpaper
exec-once = /usr/lib/polkit-kde-authentication-agent-1
exec-once = kbuildsycoca6 --noincremental
exec-once = mako
exec-once = hyprswitch init --show-title --size-factor 4 --custom-css ~/.config/hyprswitch/style.css &
exec-once = nm-applet

# ── Environment ──────────────────────────────
env = XCURSOR_SIZE,24
env = QT_QPA_PLATFORM,wayland
env = QT_QPA_PLATFORMTHEME,kde
env = QT_AUTO_SCREEN_SCALE_FACTOR,1
env = MOZ_ENABLE_WAYLAND,1
# Forces all Electron apps (Discord, VS Code, etc.) to use native Wayland
env = ELECTRON_OZONE_PLATFORM_HINT,auto
# AMD only — no Intel iGPU exposed on T2; hardware cursors can cause issues
env = WLR_NO_HARDWARE_CURSORS,1

# ── Input ────────────────────────────────────
input {
    kb_layout = us
    kb_options = caps:escape        # Caps Lock → Escape
    follow_mouse = 1
    sensitivity = -0.3

    touchpad {
        natural_scroll = false
        disable_while_typing = true
        tap-to-click = true
        drag_lock = false
        scroll_factor = 0.5
    }
}

# ── General ──────────────────────────────────
general {
    gaps_in = 4
    gaps_out = 8
    border_size = 2
    col.active_border = rgba(88c0d0ff) rgba(81a1c1ff) 45deg
    col.inactive_border = rgba(4c566aaa)
    layout = dwindle
    allow_tearing = false
}

# ── Decoration ───────────────────────────────
decoration {
    rounding = 8

    blur {
        enabled = false
    }

    shadow {
        enabled = false
    }
}

# ── Animations ───────────────────────────────
animations {
    enabled = true
    bezier = snappy, 0.05, 0.9, 0.1, 1.05
    animation = windows, 1, 4, snappy
    animation = windowsOut, 1, 3, default, popin 80%
    animation = border, 1, 10, default
    animation = fade, 1, 4, default
    animation = workspaces, 1, 4, default
}

# ── Layout ───────────────────────────────────
dwindle {
    pseudotile = true
    preserve_split = true
}

# ── Misc ─────────────────────────────────────
misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
}

# ── Window Rules ─────────────────────────────
windowrule {
    name = cheatsheet-float
    match:class = cheatsheet
    float = yes
    size = 700 500
    center = yes
}

# ─────────────────────────────────────────────
# Keybinds
# ─────────────────────────────────────────────
$mod = SUPER
$terminal = ghostty
$launcher = fuzzel

bind = $mod, Return, exec, $terminal
bind = $mod, Space, exec, $launcher
bind = $mod, Q, killactive
bind = $mod SHIFT, E, exit
bind = $mod, F, fullscreen
bind = $mod SHIFT, Space, togglefloating
bind = $mod, P, pseudo                  # dwindle pseudotile toggle
bind = $mod, E, togglesplit             # toggle horizontal/vertical split
bind = $mod, slash, exec, ghostty --class=cheatsheet --title="Keybinds" -e ~/.config/hypr/cheatsheet.sh
# ALT alternatives — work from terminals (physical Option key, Toshy never remaps Alt)
bind = ALT, Return, exec, $terminal
bind = ALT, Space, exec, $launcher
bind = ALT, Q, killactive
bind = ALT, F, fullscreen
bind = ALT, Tab, exec, hyprswitch gui --mod-key alt_l --key tab --close mod-key-release --max-switch-offset 4  # Cmd+Tab → app switcher (cross-workspace)

# ── Focus (vim keys) ─────────────────────────
bind = $mod, H, movefocus, l
bind = $mod, L, movefocus, r
bind = $mod, K, movefocus, u
bind = $mod, J, movefocus, d

# ── Move windows ─────────────────────────────
bind = $mod SHIFT, H, movewindow, l
bind = $mod SHIFT, L, movewindow, r
bind = $mod SHIFT, K, movewindow, u
bind = $mod SHIFT, J, movewindow, d

# ── Resize ───────────────────────────────────
binde = $mod CTRL, H, resizeactive, -40 0
binde = $mod CTRL, L, resizeactive,  40 0
binde = $mod CTRL, K, resizeactive, 0 -40
binde = $mod CTRL, J, resizeactive, 0  40

# ── Workspaces ───────────────────────────────
# SUPER+N: works from GUI apps (Toshy maps physical Ctrl → Super in non-terminal context)
# ALT+N:   works from terminal (physical Option key, Toshy never remaps Alt)
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = ALT, 1, workspace, 1
bind = ALT, 2, workspace, 2
bind = ALT, 3, workspace, 3
bind = ALT, 4, workspace, 4
bind = ALT, 5, workspace, 5
bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5
bind = ALT SHIFT, 1, movetoworkspace, 1
bind = ALT SHIFT, 2, movetoworkspace, 2
bind = ALT SHIFT, 3, movetoworkspace, 3
bind = ALT SHIFT, 4, movetoworkspace, 4
bind = ALT SHIFT, 5, movetoworkspace, 5

# ── Mouse ────────────────────────────────────
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow

# ── MBP Function Keys ────────────────────────
bind = , XF86MonBrightnessUp,   exec, brightnessctl set +10%
bind = , XF86MonBrightnessDown, exec, brightnessctl set 10%-
bind = , XF86AudioRaiseVolume,  exec, pamixer --increase 5
bind = , XF86AudioLowerVolume,  exec, pamixer --decrease 5
bind = , XF86AudioMute,         exec, pamixer --toggle-mute
bind = , XF86KbdBrightnessUp,   exec, brightnessctl -d apple::kbd_backlight set +10%
bind = , XF86KbdBrightnessDown, exec, brightnessctl -d apple::kbd_backlight set 10%-

# ── Screenshots (macOS-style) ────────────────
# Cmd+Shift+3 = full screen, Cmd+Shift+4 = region
# Toshy: Cmd → Right Ctrl in GUI, Left Ctrl in terminal; Option (Alt) never remapped
# CTRL SHIFT 3/4 catches GUI+terminal; ALT SHIFT 3/4 is Option+Shift fallback
$screenshot_full = grim /tmp/screenshot-tmp.png && cp /tmp/screenshot-tmp.png ~/screenshots/screenshot-$(date +%Y%m%d-%H%M%S).png && wl-copy < /tmp/screenshot-tmp.png && notify-send "Screenshot" "Copied to clipboard" -t 2000
$screenshot_region = grim -g "$(slurp)" /tmp/screenshot-tmp.png && cp /tmp/screenshot-tmp.png ~/screenshots/screenshot-$(date +%Y%m%d-%H%M%S).png && wl-copy < /tmp/screenshot-tmp.png && notify-send "Screenshot" "Region copied to clipboard" -t 2000
bind = CTRL SHIFT, 3, exec, $screenshot_full
bind = ALT  SHIFT, 3, exec, $screenshot_full
bind = CTRL SHIFT, 4, exec, $screenshot_region
bind = ALT  SHIFT, 4, exec, $screenshot_region
