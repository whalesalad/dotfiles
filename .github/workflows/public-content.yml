name: Public content

on: [push, pull_request]

permissions:
  contents: read

jobs:
  public-content:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: bash tests/public_content_test.sh
